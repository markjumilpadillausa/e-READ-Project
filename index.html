<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--pink:#E6327E;--blue:#1C57B5;--green:#1E9A4B;--yellow:#FFC629;--purple:#7A3DB8;--orange:#F27A1A;--ink:#1B2140;--soft:#F3F6FD;--line:#DCE3F2}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,"Segoe UI",Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.5;
 background:var(--soft) radial-gradient(circle at 10% 20%,#ffd6e7 0 3px,transparent 4px) 0 0/90px 90px,var(--soft)}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.1;margin:0}
button,input{font:inherit}
.hand{font-family:Caveat,cursive}
/* Hero */
.hero{background:#fff;border-bottom:6px solid var(--yellow);padding:18px 16px 16px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:45% 55% 50% 50%;opacity:.95}
.b1{right:-50px;top:-50px;width:230px;height:150px;background:var(--pink);transform:rotate(-12deg)}
.b2{left:-40px;bottom:-60px;width:160px;height:110px;background:var(--yellow);opacity:.6}
.note{position:absolute;font-size:2rem;opacity:.85}
.n1{right:210px;top:16px;color:var(--blue);transform:rotate(-10deg)}.n2{right:40px;bottom:12px;color:var(--purple)}
.hero-in{max-width:1080px;margin:0 auto;position:relative;display:flex;gap:18px;align-items:center}
.logo{width:100px;height:100px;aspect-ratio:1/1;object-fit:contain;border-radius:50%;flex:none;background:#fff}
.school{margin:0;font-weight:800;color:var(--blue);font-size:.95rem}
.hero .l1{display:block;font-size:clamp(1.5rem,4.2vw,2.5rem);color:var(--blue)}
.hero .l2{display:inline-block;font-size:clamp(1.2rem,3.4vw,2rem);color:#fff;background:var(--ink);padding:2px 14px 0;transform:rotate(-1.5deg);margin-top:6px;box-shadow:5px 5px 0 var(--pink)}
.tagline{margin:10px 0 0;font-size:1.5rem;color:var(--pink)}
.who{max-width:1080px;margin:10px auto 0;position:relative;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
@media (max-width:560px){.hero-in{flex-direction:column;align-items:flex-start}.logo{width:76px;height:76px}.note{display:none}}
/* Nav */
nav{max-width:1080px;margin:16px auto 0;padding:0 14px;display:flex;gap:8px;flex-wrap:wrap}
nav button{border:2px solid var(--ink);background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;cursor:pointer;transition:transform .15s}
nav button:hover{transform:translateY(-2px)}
nav button.on{background:var(--ink);color:#fff;box-shadow:3px 3px 0 var(--yellow)}
main{max-width:1080px;margin:16px auto 40px;padding:0 14px}
.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;position:relative}
.panel h2{font-size:1.5rem;margin-bottom:6px}
.bar{height:9px;margin:-18px -18px 14px;border-radius:16px 16px 0 0}
.muted{color:#5A6385}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tag{display:inline-block;font-size:.8rem;font-weight:800;padding:2px 10px;border-radius:999px;color:#fff;margin-bottom:6px}
.t-pair{background:var(--pink)}.t-ks{background:var(--blue)}
.btn{display:inline-block;text-decoration:none;border:0;border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pink{background:var(--pink)}.btn.green{background:var(--green)}.btn.purple{background:var(--purple)}.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}.btn.red{background:#C62828}.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.big{font-size:1.15rem;padding:12px 18px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn:focus-visible,nav button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
label{font-weight:700;display:block;margin:10px 0 4px}
input[type=email],input[type=text],input[type=password],input[type=number],input[type=datetime-local]{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
input:disabled{background:var(--soft);color:var(--ink)}
.login{max-width:440px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--soft);font-size:.85rem}
td.num,th.num{text-align:right}
.sheet td input{max-width:110px;text-align:right}
.total{font-family:"Baloo 2";font-size:1.6rem;color:var(--green)}
.lock{font-weight:800;color:var(--green)}.open{font-weight:800;color:#B26A00}.none{font-weight:800;color:#C62828}
.tip{background:#FFF6D6;border-left:6px solid var(--yellow);padding:10px 14px;border-radius:10px;margin:10px 0}
.alert{background:#FDE7EF;border-left:6px solid var(--pink);padding:10px 14px;border-radius:10px;margin:10px 0}
.good{background:#E3F6EA;border-left:6px solid var(--green);padding:10px 14px;border-radius:10px;margin:10px 0}
.progress{height:16px;background:var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.progress span{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--green) 0 12px,#27b35a 12px 24px)}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:8px}
.step{background:var(--soft);border-radius:14px;padding:12px}
.step b{display:block;font-family:"Baloo 2";font-size:1.1rem}
.step .num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--pink);color:#fff;align-items:center;justify-content:center;font-weight:800;margin-bottom:4px}
/* Video cards */
.vcard{border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column}
.vtop{height:150px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff}
.vtop .play{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.vtop .play:after{content:"";border-left:22px solid var(--ink);border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
.vtop .lbl{position:absolute;left:12px;bottom:8px;font-family:"Baloo 2";font-size:1.3rem;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.vtop .em{position:absolute;right:12px;top:8px;font-size:1.8rem}
.vbody{padding:14px;flex:1;display:flex;flex-direction:column}
.vbody h3{font-size:1.2rem}
.vbody .btn{margin-top:auto;text-align:center}
/* Podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:18px 0 8px;flex-wrap:nowrap}
.pod{flex:1;max-width:230px;text-align:center}
.pod .who2{font-family:"Baloo 2";font-size:1.05rem;line-height:1.15;margin-bottom:6px}
.pod .medal{font-size:2.4rem;line-height:1}
.pod .block{border-radius:14px 14px 0 0;color:#fff;font-family:"Baloo 2";font-size:2rem;display:flex;flex-direction:column;justify-content:center;align-items:center}
.pod .block small{font-family:Nunito;font-size:.85rem;font-weight:800}
.p1 .block{height:170px;background:linear-gradient(var(--yellow),#E6A800);color:var(--ink)}
.p2 .block{height:125px;background:linear-gradient(#9AA7C7,#6F7DA3)}
.p3 .block{height:95px;background:linear-gradient(#E39A5B,#B86A2E)}
.crown{animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.rank1 td{background:#FFF6D6}
.rk{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;background:var(--line)}
.rank1 .rk{background:var(--yellow)}
.wait{text-align:center;padding:28px 18px}
.wait .big{font-size:3rem}
/* Modal, toast */
.modal{position:fixed;inset:0;background:rgba(27,33,64,.7);display:flex;align-items:center;justify-content:center;padding:14px;z-index:40}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
.mbox .x{float:right}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:60;max-width:90vw}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.footer{text-align:center;color:#5A6385;font-size:.9rem;margin:20px 0 30px}
/* Show mode */
#show{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 30%,#2b3a8a,#14183a 70%);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
#show.on{display:flex}
#show .top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#show .top img{width:56px;height:56px;object-fit:contain;border-radius:50%;background:#fff}
#show .ttl{font-family:"Baloo 2";font-size:clamp(1rem,2.4vw,1.5rem);color:var(--yellow)}
#show .stage{max-width:980px;width:100%}
#show .rankbig{font-family:"Baloo 2";font-size:clamp(2rem,6vw,4.4rem);color:var(--yellow)}
#show .score{font-family:"Baloo 2";font-size:clamp(3rem,11vw,8rem);line-height:1}
#show .mystery{font-size:clamp(4rem,14vw,9rem);animation:bob 1.4s ease-in-out infinite}
#show .name{font-family:"Baloo 2";font-size:clamp(2.2rem,7vw,5.2rem);line-height:1.05;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
#show .teachers{font-size:clamp(1rem,2.6vw,1.6rem);opacity:.9;margin-top:8px}
#show .lucky{display:inline-block;margin-top:18px;background:var(--pink);padding:8px 18px;border-radius:999px;font-size:clamp(1rem,2.6vw,1.6rem);font-weight:800}
#show .champ{font-family:"Baloo 2";font-size:clamp(1.6rem,5vw,3.4rem);color:var(--yellow);letter-spacing:.02em;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#show .hint{position:absolute;bottom:14px;left:0;right:0;opacity:.7;font-size:.95rem}
#show .catbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
#show .dots{margin-top:22px;display:flex;gap:8px;justify-content:center}
#show .dots span{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3)}
#show .dots span.done{background:var(--yellow)}
#show .spot{position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 20deg,rgba(255,198,41,.08) 20deg 40deg,transparent 40deg 80deg,rgba(230,50,126,.08) 80deg 100deg,transparent 100deg);animation:spin 18s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .5s 3}
/* Print */
#printArea{display:none}
@media print{
 @page{size:A4 landscape;margin:12mm}
 body{background:#fff}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
 .pp{page-break-after:always;font-family:Nunito,Arial,sans-serif;color:#000;font-size:11pt}
 .pp:last-child{page-break-after:auto}
 .ph{display:flex;align-items:center;gap:14px;border-bottom:3px solid #000;padding-bottom:8px;margin-bottom:10px}
 .ph img{width:70px;height:70px;object-fit:contain}
 .ph .t{flex:1;text-align:center}
 .ph .t div{line-height:1.25}
 .pp table{min-width:0;font-size:9.5pt}
 .pp th,.pp td{border:1px solid #000;padding:5px 6px}
 .pp th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .sig{display:flex;justify-content:space-around;gap:20px;margin-top:34px;text-align:center}
 .sig div{flex:1}
 .sig .ln{border-top:1px solid #000;margin-top:34px;padding-top:2px;font-weight:800}
 .wm{color:#C62828;font-weight:800;text-align:center;border:2px dashed #C62828;padding:4px;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const FX = { parts: [], running: false };
function confetti(n, opts) {

  const cv = document.getElementById('fx'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#E6327E', '#1C57B5', '#1E9A4B', '#FFC629', '#7A3DB8', '#F27A1A', '#fff'];
  for (let i = 0; i < n; i++) {
    const side = opts && opts.cannon ? (i % 2 ? 0 : W) : Math.random() * W;
    FX.parts.push({ x: side, y: opts && opts.cannon ? H * .8 : -20 - Math.random() * H * .3,
      vx: opts && opts.cannon ? (side === 0 ? 1 : -1) * (4 + Math.random() * 8) : (Math.random() - .5) * 3,
      vy: opts && opts.cannon ? -(10 + Math.random() * 10) : 2 + Math.random() * 3,
      r: 5 + Math.random() * 7, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[i % cols.length], life: 0 });

function fxLoop() {
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');

let AC = null;
function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function clap(times) {
  const a = ac(); if (!a) return;
  for (let i = 0; i < (times || 10); i++) {
    const t = a.currentTime + i * (0.11 + Math.random() * 0.08), len = 0.12;
    const buf = a.createBuffer(1, a.sampleRate * len, a.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / d.length, 4);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = 'bandpass'; f.frequency.value = 1000 + Math.random() * 600; g.gain.value = .7;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(a.destination); src.start(t);
  }
}
function fanfare() {
  const a = ac(); if (!a) return;
  [[523, 0], [659, .15], [784, .3], [1047, .5], [784, .75], [1047, .9]].forEach(([fq, dt]) => {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + dt;
    o.type = 'triangle'; o.frequency.value = fq; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .45);
  });
}
function drumroll(sec) {
  const a = ac(); if (!a) return;
  for (let t = 0; t < sec; t += 0.05) {
    const buf = a.createBuffer(1, a.sampleRate * .04, a.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / d.length);
    const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = .15 + .5 * (t / sec);
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(a.destination); s.start(a.currentTime + t);
  }
}

/* ---------- Boot ---------- */
async function boot() {
  document.getElementById('logoImg').src = LOGO;
  try { S.token = sessionStorage.getItem('wtm_token'); S.user = JSON.parse(sessionStorage.getItem('wtm_user') || 'null'); } catch (e) {}
  if (S.token && S.user) { try { await load(); return; } catch (e) { logout(true); } }
  S.data = await run('getPublic'); S.tab = 'signin'; render();
}
async function load() {
  const fn = { judge: 'getJudge', teacher: 'getTeacher', head: 'getHead' }[S.user.role];
  S.data = await run(fn, S.token);
  if (!S.tab || S.tab === 'signin') S.tab = { judge: 'score', teacher: 'lucky', head: 'overview' }[S.user.role];
  render();
}
async function refresh(btn) { S.data = await busy(btn, S.user ? run({ judge: 'getJudge', teacher: 'getTeacher', head: 'getHead' }[S.user.role], S.token) : run('getPublic')); render(); toast('Updated.'); }
function logout(silent) {
  try { sessionStorage.removeItem('wtm_token'); sessionStorage.removeItem('wtm_user'); } catch (e) {}
  S.token = null; S.user = null; S.tab = 'signin';
  if (!silent) run('getPublic').then(d => { S.data = d; render(); });
}

  if (S.user.role === 'judge') return [['score', '&#128221; My Scoresheet']].concat(common);
  if (S.user.role === 'teacher') return [['lucky', '&#127808; Lucky Learner']].concat(common);
  return [['overview', '&#128202; Overview'], ['reactions', '&#10084;&#65039; Reactions'], ['scores', '&#128203; Scoresheets'], ['luckyhead', '&#127808; Lucky Learners']].concat(common, [['settings', '&#9881;&#65039; Settings']]);

/* ---------- Presentation mode ---------- */
const SH = { cat: null, list: [], i: 0, phase: 'pick' };
function startShow() {
  if (!canSeeFinal()) return toast('Results are not yet available.');
  SH.phase = 'pick'; const el = document.getElementById('show'); el.classList.add('on');
  try { el.requestFullscreen && el.requestFullscreen(); } catch (e) {}
  drawShow(); ac();
}
function endShow() { document.getElementById('show').classList.remove('on'); try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {} }
function pickCat(cat) {
  const c = S.data.results.cats.find(x => x.cat === cat);
  SH.cat = cat; SH.list = c.rows.slice().sort((a, b) => a.final - b.final || b.rank - a.rank); SH.i = 0; SH.phase = 'score'; drawShow();
}
function nextShow() {
  if (SH.phase === 'pick') return;
  if (SH.phase === 'done') { SH.phase = 'pick'; return drawShow(); }
  if (SH.phase === 'score') {
    const x = SH.list[SH.i];
    if (x.rank === 1) { SH.phase = 'drum'; drawShow(); drumroll(2.2); setTimeout(() => { SH.phase = 'reveal'; drawShow(); fanfare(); clap(28); confetti(260, { cannon: true }); setTimeout(() => confetti(200), 700); }, 2300); return; }
    SH.phase = 'reveal'; drawShow(); clap(10); confetti(70); return;
  }
  if (SH.phase === 'reveal') {
    if (SH.i < SH.list.length - 1) { SH.i++; SH.phase = 'score'; } else SH.phase = 'done';
    drawShow();
  }
}
function prevShow() { if (SH.phase === 'reveal') SH.phase = 'score'; else if (SH.phase === 'score' && SH.i > 0) { SH.i--; SH.phase = 'reveal'; } drawShow(); }
function drawShow() {
  const el = document.getElementById('show');
  let body = '';
  if (SH.phase === 'pick') {
    body = '<img src="' + LOGO + '" style="width:130px;height:130px;object-fit:contain;border-radius:50%;background:#fff"><div class="name" style="margin-top:16px">Search for the Best TikTok Video</div>' +
      '<div class="teachers">World Teachers\' Month 2026. Choose a category to reveal.</div><div class="catbtns">' +
      S.data.results.cats.map(c => '<button class="btn big ' + (c.cat === 'By Pair' ? 'pink' : '') + '" onclick="event.stopPropagation();pickCat(\'' + c.cat + '\')">' + (c.cat === 'By Pair' ? '&#128111; ' : '&#127891; ') + c.cat + '</button>').join('') + '</div>';
  } else if (SH.phase === 'done') {
    const champ = SH.list[SH.list.length - 1];
    body = '<div class="mystery">&#127942;</div><div class="champ">Congratulations to all ' + esc(SH.cat) + ' entries!</div><div class="teachers">Champion: ' + esc(champ.name) + '</div><div class="teachers" style="margin-top:20px">Click to choose another category</div>';
  } else {
    const x = SH.list[SH.i], champ = x.rank === 1;
    const place = champ ? 'CHAMPION' : ord(x.rank) + ' Place';
    body = '<div class="rankbig">' + (champ ? '&#128081; ' : '') + place + '</div>';
    if (SH.phase === 'score') body += '<div class="score">' + fmt(x.final) + '</div><div class="teachers">points</div><div class="mystery">&#127873;</div><div class="teachers">Who could it be? Click to reveal!</div>';
    else if (SH.phase === 'drum') body += '<div class="score">' + fmt(x.final) + '</div><div class="mystery shake">&#129345;</div><div class="teachers">Drumroll please...</div>';
    else body += (champ ? '<div class="champ">&#127881; Congratulations! &#127881;</div>' : '') + '<div class="name">' + esc(x.name) + '</div>' +
      (x.teachers.length ? '<div class="teachers">&#128105;&#8205;&#127979; ' + esc(x.teachers.join(', ')) + '</div>' : '') +
      '<div class="teachers">' + fmt(x.final) + ' points</div>' +
      '<div class="lucky">&#127808; Lucky Learner: ' + (x.lucky ? esc(x.lucky) : 'none encoded') + (champ && x.lucky ? ' wins a cash prize!' : '') + '</div>';
    body += '<div class="dots">' + SH.list.map((y, k) => '<span class="' + (k < SH.i || (k === SH.i && SH.phase === 'reveal') ? 'done' : '') + '"></span>').join('') + '</div>';
  }
  el.innerHTML = '<div class="spot"></div><div class="top"><img src="' + LOGO + '"><div class="ttl">' + (SH.cat && SH.phase !== 'pick' ? esc(SH.cat) : 'WTM 2026 TikTok Dance Challenge') + '</div>' +
    '<button class="btn ghost sm" onclick="event.stopPropagation();endShow()">Exit</button></div><div class="stage">' + body + '</div>' +
    '<div class="hint">Click anywhere or press Space for next. Left arrow to go back. Esc to exit.</div>';
}
document.getElementById('show').addEventListener('click', () => nextShow());
document.addEventListener('keydown', e => {
  if (!document.getElementById('show').classList.contains('on')) return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); nextShow(); }
  else if (e.key === 'ArrowLeft') prevShow();
  else if (e.key === 'Escape') endShow();
});

    return '<div class="panel" id="card_' + e.id + '"><div class="bar" style="background:' + c[0] + '"></div>' + catTag(e.cat) + '<h2>' + c[1] + ' ' + esc(e.name) + '</h2>' +
      '<div class="row" style="margin-top:0">' + (e.video ? '<a class="btn" style="background:' + c[0] + '" href="' + esc(e.video) + '" target="_blank" rel="noopener">&#9654; Watch the video</a>' : '') +
      '<span class="' + (L ? 'lock' : d.mine[e.id] ? 'open' : 'none') + '">' + (L ? '&#128274; Locked and sent' : (d.mine[e.id] ? '&#9888;&#65039; Draft only, not yet sent' : 'Not yet rated')) + '</span></div>' +
      '<div class="tablewrap sheet"><table><thead><tr><th>Criteria</th><th class="num">Highest</th><th class="num">Your rating</th></tr></thead><tbody>' +
      d.criteria.map((cr, k) => '<tr><td>' + esc(cr.n) + '</td><td class="num">' + cr.max + '</td><td class="num"><input type="number" min="0" max="' + cr.max + '" step="0.5" id="s_' + e.id + '_' + k + '" value="' + (m.c[k] == null ? '' : m.c[k]) + '"' + (L ? ' disabled' : '') + ' oninput="sum(\'' + e.id + '\')" aria-label="' + esc(cr.n) + ', 0 to ' + cr.max + '"></td></tr>').join('') +
      '<tr><td class="muted">Most Reacted TikTok Video</td><td class="num muted">10</td><td class="num muted">by tabulators</td></tr>' +
      '<tr><td><b>Your total</b></td><td class="num">90</td><td class="num"><span class="total" id="t_' + e.id + '">' + fmt(sumOf(m.c)) + '</span></td></tr></tbody></table></div>' +
      '<div class="row">' + (L
        ? '<button class="btn pink" onclick="unlockAsk(\'' + e.id + '\')">&#128275; Unlock to edit</button>'
        : '<button class="btn ghost" onclick="saveS(this,\'' + e.id + '\',false)">Save draft</button><button class="btn green big" onclick="saveS(this,\'' + e.id + '\',true)">&#128274; Save and lock</button>') +
      '</div></div>';
  }).join('');
}
function sumOf(a) { return (a || []).reduce((s, v) => s + (v == null || v === '' ? 0 : Number(v)), 0); }
function vals(id) { return S.data.criteria.map((c, k) => document.getElementById('s_' + id + '_' + k).value); }
function sum(id) { document.getElementById('t_' + id).textContent = fmt(sumOf(vals(id))); }
async function saveS(btn, id, lock) {
  const v = vals(id);
  for (let k = 0; k < v.length; k++) { const c = S.data.criteria[k];
    if (v[k] !== '' && (Number(v[k]) < 0 || Number(v[k]) > c.max)) return toast(c.n + ' must be from 0 to ' + c.max + '.'); }
  if (lock && !confirm('Lock your scores for ' + entryName(id) + '? They will be sent to the tabulators. You need your PIN to edit.')) return;
  S.data = await busy(btn, run('saveScore', S.token, id, v, lock));
  render(); document.getElementById('card_' + id).scrollIntoView({ block: 'center' });
  if (lock) { confetti(50); toast('Locked and sent to the tabulators.'); } else toast('Draft saved. Remember to lock it so it counts.');
}
function unlockAsk(id) {
  openModal('<h2>&#128275; Unlock scoresheet</h2><p>' + esc(entryName(id)) + '</p><label for="upin">Your PIN</label><input id="upin" type="password" inputmode="numeric" onkeydown="if(event.key===\'Enter\')doUnlock(this,\'' + id + '\')">' +
    '<p class="muted">After editing, lock it again so the tabulators receive it.</p><div class="row"><button class="btn pink" onclick="doUnlock(this,\'' + id + '\')">Unlock</button></div>');
  setTimeout(() => document.getElementById('upin').focus(), 50);
}
async function doUnlock(btn, id) {
  S.data = await busy(btn, run('unlockScore', S.token, id, document.getElementById('upin').value));
  closeModal(); render(); toast('Unlocked. Lock it again after editing.');
}
function openModal(h) { document.getElementById('mbody').innerHTML = h; document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('mbody').innerHTML = ''; }

/* ---------- Teacher ---------- */
function resultButtons() {
  return canSeeFinal() ? '<div class="panel"><h2>&#127942; Results are in!</h2><div class="row"><button class="btn purple big" onclick="startShow()">&#127908; Present results</button><button class="btn ghost big" onclick="printResults()">&#128424;&#65039; Print results</button><button class="btn ghost" onclick="go(\'results\')">View results</button></div></div>' : '';
}
function vLucky() {
  const d = S.data, open = d.luckyOpen;
  let h = resultButtons() + '<div class="panel"><div class="bar" style="background:var(--purple)"></div><h2>&#127808; Lucky Learner</h2>' +
    '<p>Type the name of your entry\'s Lucky Learner. If your entry wins, the Lucky Learner also receives a cash prize!</p>' +
    (open ? '<div class="tip">Encoding closes on <b>' + when(d.luckyDeadline) + '</b>. Entries with no name by then will have no Lucky Learner.</div>'
          : '<div class="alert">Encoding closed on ' + when(d.luckyDeadline) + '.</div>') + '</div>';
  if (!d.mine.length) return h + '<div class="panel">Your account has no assigned entry yet. Please message the School Head.</div>';
  return h + d.mine.map(id => {
    const l = d.lucky[id];
    return '<div class="panel"><h2>' + (COLORS[id] ? COLORS[id][1] : '') + ' ' + esc(entryName(id)) + '</h2>' +
      '<label for="lk_' + id + '">Lucky Learner\'s full name</label><input id="lk_' + id + '" type="text" value="' + esc(l ? l.name : '') + '"' + (open ? '' : ' disabled') + '>' +
      (l ? '<p class="muted">Encoded by ' + esc(l.by) + ' on ' + esc(l.updated) + '</p>' : '') +
      (open ? '<div class="row"><button class="btn" onclick="saveLk(this,\'' + id + '\')">' + (l ? 'Update name' : 'Save name') + '</button></div>' : '') + '</div>';
  }).join('');
}
async function saveLk(btn, id) {
  S.data = await busy(btn, run('saveLucky', S.token, id, document.getElementById('lk_' + id).value));
  render(); toast('Lucky Learner saved!'); confetti(40);
}

/* ---------- School Head ---------- */
function judgeStatus() {
  const d = S.data, rows = d.results.cats.flatMap(c => c.rows);
  return d.judges.map(j => {
    const st = { locked: [], draft: [], none: [] };
    rows.forEach(x => { const z = x.judges[j.slot - 1]; (z.locked ? st.locked : z.total !== null ? st.draft : st.none).push(x.name); });
    return Object.assign({}, j, st);
  });
}
function vOverview() {
  const d = S.data, r = d.results, js = judgeStatus();
  return '<div class="panel"><div class="bar" style="background:var(--yellow)"></div><h2>&#128202; Overview</h2>' +
    '<div class="progress"><span style="width:' + Math.round(r.locked / r.needed * 100) + '%"></span></div>' +
    '<p>Locked scoresheets: <b>' + r.locked + ' of ' + r.needed + '</b>. Reaction counts: <b>' + (r.reactionsDone ? 'entered' : 'not yet entered') + '</b>. Results open to all: <b>' + (r.complete ? 'yes' : 'no') + '</b>.</p>' +
    '<p class="muted">Reaction cutoff: ' + when(d.reactionCutoff) + '. Lucky Learner encoding closes: ' + when(d.luckyDeadline) + '. Teacher accounts: ' + d.teachers + '.</p>' +
    '<div class="row"><button class="btn purple" onclick="go(\'results\')">&#127942; Results and presentation</button></div></div>' +
    '<div class="panel"><div class="bar" style="background:var(--blue)"></div><h2>&#128269; Judges follow up</h2><p class="muted">Draft scores are not counted until the judge locks them.</p>' +
    js.map(j => {
      const ok = !j.draft.length && !j.none.length;
      const msg = 'Good day, ' + (j.name || 'Judge') + '! This is a friendly reminder for the WTM 2026 TikTok Dance Challenge. ' +
        (j.draft.length ? 'Please lock your draft scores for: ' + j.draft.join(', ') + '. ' : '') +
        (j.none.length ? 'Not yet rated: ' + j.none.join(', ') + '. ' : '') + 'Only locked scores are sent to the tabulators. Thank you!';
      return '<div class="panel" style="border-color:' + (ok ? 'var(--green)' : 'var(--pink)') + '"><h3>' + (ok ? '&#9989; ' : '&#9888;&#65039; ') + 'Judge ' + j.slot + ': ' + esc(j.name || 'name not set') + '</h3>' +
        '<p class="muted" style="margin:2px 0 8px">' + esc(j.email || 'email not set') + '</p>' +
        '<p><span class="lock">Locked ' + j.locked.length + '</span> &nbsp; <span class="open">Draft ' + j.draft.length + '</span> &nbsp; <span class="none">Not rated ' + j.none.length + '</span></p>' +
        (j.draft.length ? '<p><b>Draft only:</b> ' + esc(j.draft.join(', ')) + '</p>' : '') +
        (j.none.length ? '<p><b>Not rated:</b> ' + esc(j.none.join(', ')) + '</p>' : '') +
        (ok ? '<div class="good">All scores locked. Thank you, Judge!</div>' :
          '<div class="row">' + (j.email ? '<a class="btn sm" href="mailto:' + esc(j.email) + '?subject=' + encodeURIComponent('Reminder: Please lock your WTM 2026 scores') + '&body=' + encodeURIComponent(msg) + '">&#9993;&#65039; Email reminder</a>' : '') +
          '<button class="btn ghost sm" data-msg="' + esc(msg) + '" onclick="copyMsg(this)">&#128203; Copy message for Messenger</button></div>') + '</div>';
    }).join('') + '</div>' +
    '<div class="panel"><div class="bar" style="background:#C62828"></div><h2>&#129529; Clear test data</h2><p>Use this before launch to erase sample entries. This cannot be undone.</p><div class="row">' +
    '<button class="btn red sm" onclick="reset(this,\'scores\')">Erase all scores</button><button class="btn red sm" onclick="reset(this,\'reactions\')">Erase reaction counts</button>' +
    '<button class="btn red sm" onclick="reset(this,\'lucky\')">Erase Lucky Learners</button><button class="btn red" onclick="reset(this,\'all\')">Erase everything</button></div></div>';
}
function copyMsg(btn) {
  const t = btn.getAttribute('data-msg');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Message copied. Paste it in Messenger.'), () => prompt('Copy this message:', t));
}
async function reset(btn, what) {
  if (prompt('Type ERASE to confirm.') !== 'ERASE') return;
  S.data = await busy(btn, run('headReset', S.token, what)); render(); toast('Data erased.');
}
function vReactions() {
  const d = S.data, rows = d.results.cats.flatMap(c => c.rows), passed = new Date() >= new Date(d.reactionCutoff);
  const byId = {}; rows.forEach(x => byId[x.id] = x);
  return '<div class="panel"><div class="bar" style="background:var(--pink)"></div><h2>&#10084;&#65039; Reaction counts</h2>' +
    '<p>At the cutoff, open each official post and type its total reactions. The system computes the 10 point reaction score per category.</p>' +
    (passed ? '<div class="tip">Cutoff reached: ' + when(d.reactionCutoff) + '. Record the counts as of this time.</div>'
            : '<div class="alert">Cutoff is ' + when(d.reactionCutoff) + '. Counts may still change until then.</div>') +
    '<div class="tablewrap"><table><thead><tr><th>Entry</th><th>Category</th><th class="num">Reactions</th><th class="num">Score (10)</th><th></th></tr></thead><tbody>' +
    d.entries.map(e => '<tr><td>' + esc(e.name) + '</td><td>' + e.cat + '</td><td class="num"><input type="number" min="0" step="1" id="rx_' + e.id + '" value="' + (byId[e.id].reactions == null ? '' : byId[e.id].reactions) + '" style="max-width:130px;text-align:right"></td>' +
      '<td class="num">' + fmt(byId[e.id].rscore) + '</td><td><a class="btn ghost sm" href="' + esc(e.video) + '" target="_blank" rel="noopener">Open post</a></td></tr>').join('') +
    '</tbody></table></div><div class="row"><button class="btn green" onclick="saveRx(this)">Save reaction counts</button></div></div>';
}
async function saveRx(btn) {
  const m = {}; S.data.entries.forEach(e => m[e.id] = document.getElementById('rx_' + e.id).value);
  S.data = await busy(btn, run('headSaveReactions', S.token, m)); render(); toast('Reaction counts saved.');
}
function vScores() {
  const d = S.data, rows = d.results.cats.flatMap(c => c.rows);
  return '<div class="panel"><div class="bar" style="background:var(--blue)"></div><h2>&#128203; Scoresheets</h2><p>Unlock a scoresheet so a judge can correct it, or delete it to erase that rating.</p></div>' +
    rows.map(x => { const ct = critTotals(x);
      return '<div class="panel">' + catTag(x.cat) + '<h2>' + esc(x.name) + '</h2><div class="tablewrap"><table><thead><tr><th>Judge</th>' +
      d.criteria.map((c, k) => '<th class="num" title="' + esc(c.n) + '">' + SHORT[k] + ' (' + c.max + ')</th>').join('') + '<th class="num">Total (90)</th><th>Status</th><th></th></tr></thead><tbody>' +
      x.judges.map((j, i) => '<tr><td>' + esc(j.label) + (j.name ? '<br><span class="muted">' + esc(j.name) + '</span>' : '') + '</td>' +
        d.criteria.map((c, k) => '<td class="num">' + fmt(j.c[k]) + '</td>').join('') + '<td class="num"><b>' + fmt(j.total) + '</b></td>' +
        '<td>' + (j.total === null ? '<span class="none">Not rated</span>' : j.locked ? '<span class="lock">Locked</span>' : '<span class="open">Draft</span>') + '</td><td style="white-space:nowrap">' +
        (j.locked ? '<button class="btn ghost sm" onclick="hUnlock(this,' + (i + 1) + ',\'' + x.id + '\')">Unlock</button> ' : '') +
        (j.total !== null ? '<button class="btn red sm" onclick="hDel(this,' + (i + 1) + ',\'' + x.id + '\')">Delete</button>' : '') + '</td></tr>').join('') +
      '<tr><td><b>Total</b></td>' + ct.map(v => '<td class="num"><b>' + fmt(v) + '</b></td>').join('') + '<td class="num"><b>' + fmt(judgeSum(x)) + '</b></td><td colspan="2" class="muted">Average ' + fmt(x.avg) + '</td></tr>' +
      '</tbody></table></div></div>'; }).join('');
}
async function hUnlock(btn, slot, id) { S.data = await busy(btn, run('headUnlock', S.token, slot, id)); render(); toast('Scoresheet unlocked.'); }
async function hDel(btn, slot, id) {
  if (!confirm('Delete Judge ' + slot + ' scores for ' + entryName(id) + '?')) return;
  S.data = await busy(btn, run('headDeleteScore', S.token, slot, id)); render(); toast('Scores deleted.');
}
function vLuckyHead() {
  const d = S.data;
  return '<div class="panel"><div class="bar" style="background:var(--purple)"></div><h2>&#127808; Lucky Learners</h2><p>Encoding closes for teachers on ' + when(d.luckyDeadline) + '. You can still edit or clear names here. Leave a name blank and save to clear it.</p>' +
    '<div class="tablewrap"><table><thead><tr><th>Entry</th><th>Lucky Learner</th><th>Encoded by</th><th></th></tr></thead><tbody>' +
    d.entries.map(e => { const l = d.lucky[e.id];
      return '<tr><td>' + esc(e.name) + '</td><td><input type="text" id="hl_' + e.id + '" value="' + esc(l ? l.name : '') + '"></td><td class="muted">' + (l ? esc(l.by) + '<br>' + esc(l.updated) : 'none') + '</td>' +
        '<td><button class="btn sm" onclick="hLk(this,\'' + e.id + '\')">Save</button></td></tr>'; }).join('') + '</tbody></table></div></div>';
}
async function hLk(btn, id) { S.data = await busy(btn, run('headSaveLucky', S.token, id, document.getElementById('hl_' + id).value)); render(); toast('Lucky Learner updated.'); }
function toLocalInput(iso) { const d = new Date(iso); if (isNaN(d)) return ''; return new Date(d.getTime() + 8 * 3600000).toISOString().slice(0, 16); }
function vSettings() {
  const d = S.data;
  return '<div class="panel"><div class="bar" style="background:var(--green)"></div><h2>&#9881;&#65039; Settings</h2>' +
    '<h3 style="margin-top:10px">School Head (for printed results)</h3>' +
    '<label for="hn">Name</label><input id="hn" type="text" value="' + esc(d.headName) + '">' +
    '<label for="hp">Position</label><input id="hp" type="text" value="' + esc(d.headPosition) + '">' +
    '<h3 style="margin-top:18px">Judges</h3>' + d.judges.map(j =>
      '<label for="j' + j.slot + 'e">Judge ' + j.slot + ' DepEd email</label><input id="j' + j.slot + 'e" type="email" value="' + esc(j.email) + '">' +
      '<label for="j' + j.slot + 'n">Judge ' + j.slot + ' name (hidden from teachers)</label><input id="j' + j.slot + 'n" type="text" value="' + esc(j.name) + '">').join('') +
    '<label for="jpin">Judges\' PIN</label><input id="jpin" type="text" placeholder="Leave blank to keep the current PIN">' +
    '<h3 style="margin-top:18px">Deadlines (Philippine time)</h3>' +
    '<label for="rc">Reaction cutoff</label><input id="rc" type="datetime-local" value="' + toLocalInput(d.reactionCutoff) + '">' +
    '<label for="ld">Lucky Learner encoding closes</label><input id="ld" type="datetime-local" value="' + toLocalInput(d.luckyDeadline) + '">' +
    '<h3 style="margin-top:18px">Official entry links</h3>' + d.entries.map(e =>
      '<label for="v_' + e.id + '">' + esc(e.name) + '</label><input id="v_' + e.id + '" type="text" value="' + esc(e.video) + '">').join('') +
    '<div class="row"><button class="btn green" onclick="saveSet(this)">Save settings</button></div></div>';
}
async function saveSet(btn) {
  const o = {}, g = id => document.getElementById(id).value;
  o.HEAD_NAME = g('hn'); o.HEAD_POSITION = g('hp');
  [1, 2, 3].forEach(i => { o['JUDGE' + i + '_EMAIL'] = g('j' + i + 'e').toLowerCase(); o['JUDGE' + i + '_NAME'] = g('j' + i + 'n'); });
  if (g('jpin').trim()) o.JUDGE_PIN = g('jpin');
  if (g('rc')) o.REACTION_CUTOFF = g('rc') + ':00+08:00';
  if (g('ld')) o.LUCKY_DEADLINE = g('ld') + ':00+08:00';
  S.data.entries.forEach(e => o['VIDEO_' + e.id] = g('v_' + e.id));
  S.data = await busy(btn, run('headSaveSettings', S.token, o)); render(); toast('Settings saved.');
}

boot().catch(e => { document.getElementById('app').innerHTML = '<div class="panel alert">' + esc(e) + '</div>'; });
</script>
</body>
</html>
